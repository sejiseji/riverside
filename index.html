<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>riverside</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #05060a;
        color: #f7f7f7;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        box-sizing: border-box;
      }

      pyxel-run {
        display: block;
        width: min(100vw, calc(100dvh * 393 / 852), 430px);
        height: min(100dvh, calc(100vw * 852 / 393), 100dvh);
        aspect-ratio: 393 / 852;
        touch-action: none;
      }

      pyxel-run canvas {
        width: 100% !important;
        height: 100% !important;
        image-rendering: pixelated;
      }

      @media (orientation: portrait) and (max-width: 500px) {
        body {
          padding: 0;
        }

        pyxel-run {
          width: 100vw;
          height: 100dvh;
        }
      }
    </style>
    <script src="https://cdn.jsdelivr.net/gh/kitao/pyxel@v2.9.9/wasm/pyxel.js"></script>
  </head>
  <body>
    <pyxel-run root="." name="web_bootstrap.py" gamepad="disabled"></pyxel-run>
  </body>
</html>
